<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Калькулятор EUR</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f0f4f8;
      color: #1a202c;
      min-height: 100vh;
      padding: 24px 16px 48px;
    }

    .wrap { max-width: 480px; margin: 0 auto; }

    h1 {
      text-align: center;
      font-size: 1.15rem;
      font-weight: 700;
      color: #2d3748;
      margin-bottom: 4px;
    }
    .subtitle {
      text-align: center;
      font-size: 0.8rem;
      color: #a0aec0;
      margin-bottom: 22px;
    }

    .card {
      background: white;
      border-radius: 14px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.07);
      padding: 18px 20px;
      margin-bottom: 14px;
    }
    .card-title {
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: #a0aec0;
      margin-bottom: 14px;
    }

    .bank-block { margin-bottom: 14px; }
    .bank-block:last-child { margin-bottom: 0; }

    .bank-hd {
      display: flex;
      align-items: center;
      gap: 7px;
      margin-bottom: 9px;
    }
    /* square icon (SVG or small img) */
    .bank-ico {
      width: 22px;
      height: 22px;
      flex-shrink: 0;
    }
    /* full horizontal / brand logo */
    .bank-logo {
      height: 22px;
      width: auto;
      flex-shrink: 0;
    }
    .bank-hd-name {
      font-size: 0.8rem;
      font-weight: 700;
      color: #4a5568;
      flex: 1;
    }

    .bank-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }

    .fields-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 11px;
    }

    .field label {
      display: block;
      font-size: 0.72rem;
      color: #718096;
      margin-bottom: 5px;
    }
    .field input {
      width: 100%;
      border: 1.5px solid #e2e8f0;
      border-radius: 8px;
      padding: 8px 10px;
      font-size: 1.05rem;
      font-weight: 600;
      color: #1a202c;
      outline: none;
      transition: border-color 0.15s;
    }
    .field input:focus { border-color: #4299e1; }
    .field input::placeholder { color: #cbd5e0; font-weight: 400; font-size: 0.95rem; }

    .target-row {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .target-row label {
      font-size: 0.95rem;
      font-weight: 600;
      color: #4a5568;
      white-space: nowrap;
    }
    .target-row .inp-wrap { display: flex; align-items: center; flex: 1; }
    .target-row input {
      flex: 1;
      border: 2px solid #e2e8f0;
      border-radius: 10px;
      padding: 10px 13px;
      font-size: 1.55rem;
      font-weight: 700;
      color: #1a202c;
      outline: none;
      min-width: 0;
      transition: border-color 0.15s;
    }
    .target-row input:focus { border-color: #4299e1; }
    .target-row .sym {
      font-size: 1.4rem;
      font-weight: 700;
      color: #a0aec0;
      margin-left: 9px;
    }

    .results { display: flex; flex-direction: column; gap: 10px; }

    .res-card {
      background: white;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.07);
      padding: 14px 18px;
      display: flex;
      align-items: center;
      gap: 14px;
      border: 3px solid transparent;
      transition: border-color 0.25s, opacity 0.25s;
      position: relative;
    }
    .res-card.winner { border-color: #68d391; }
    .res-card.second { border-color: #f6e05e; }
    .res-card.loser  { opacity: 0.42; }

    .res-num {
      font-size: 0.65rem;
      font-weight: 800;
      color: #cbd5e0;
      width: 18px;
      flex-shrink: 0;
      text-align: center;
    }
    .res-card.winner .res-num { color: #68d391; }
    .res-card.second .res-num { color: #d69e2e; }

    .res-body { flex: 1; min-width: 0; }
    .res-name {
      font-size: 0.82rem;
      color: #718096;
      margin-bottom: 3px;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .res-name span {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      min-width: 0;
    }
    .res-ico { width: 15px; height: 15px; flex-shrink: 0; }

    .res-rub {
      font-size: 1.65rem;
      font-weight: 700;
      color: #1a202c;
      letter-spacing: -0.5px;
      line-height: 1;
    }
    .res-card.winner .res-rub { color: #276749; }
    .res-card.second .res-rub { color: #744210; }

    .res-right { text-align: right; flex-shrink: 0; }
    .res-rate { font-size: 1.05rem; font-weight: 700; color: #2d3748; }
    .res-rate-label { font-size: 0.7rem; color: #a0aec0; margin-top: 2px; }

    .win-badge, .sec-badge {
      position: absolute;
      top: -1px; right: 14px;
      font-size: 0.62rem;
      font-weight: 800;
      padding: 2px 8px;
      border-radius: 0 0 8px 8px;
      letter-spacing: 0.5px;
    }
    .win-badge { background: #68d391; color: #22543d; }
    .sec-badge { background: #f6e05e; color: #744210; }

    .verdict {
      background: white;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.07);
      padding: 14px 18px;
      text-align: center;
      font-size: 0.9rem;
      color: #718096;
    }
    .verdict b { color: #2d3748; font-size: 1rem; }
    .verdict .vs { font-size: 0.78rem; color: #a0aec0; margin-top: 4px; }

    .auto-tag { font-size: 0.65rem; font-weight: 600; color: #68d391; }
    .auto-tag.err { color: #fc8181; }

    .ref-btn {
      background: none;
      border: 1px solid #e2e8f0;
      border-radius: 5px;
      color: #718096;
      font-size: 0.8rem;
      padding: 1px 5px;
      cursor: pointer;
      line-height: 1.4;
      transition: background 0.15s;
    }
    .ref-btn:hover { background: #edf2f7; }
    .ref-btn.spin { animation: spin 0.7s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .ext-link { color: #4299e1; text-decoration: none; font-size: 0.72rem; }
    .ext-link:hover { color: #2b6cb0; }
    .sep { height: 1px; background: #f0f4f8; margin: 14px 0; }
  </style>
</head>
<body>

<!-- ── Inline SVG logos (no external requests) ─────────────────── -->
<svg style="display:none" aria-hidden="true">

  <!-- BystroBank: orange background, white right arrow -->
  <symbol id="ico-bystr" viewBox="0 0 24 24">
    <rect width="24" height="24" rx="5" fill="#F5891A"/>
    <path d="M5 12h14M13 7l6 5-6 5"
          stroke="white" stroke-width="2.5"
          stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </symbol>

  <!-- Korona: coral background, white 3-peak crown -->
  <symbol id="ico-korona" viewBox="0 0 24 24">
    <rect width="24" height="24" rx="5" fill="#D93E2A"/>
    <path d="M4 17 L8 9.5 L11 13 L12 7.5 L13 13 L16 9.5 L20 17 Z" fill="white"/>
    <rect x="3.5" y="16" width="17" height="3" rx="1.5" fill="white"/>
  </symbol>

  <!-- Credo: blue background, white circular sync arrows -->
  <symbol id="ico-credo" viewBox="0 0 24 24">
    <rect width="24" height="24" rx="5" fill="#0070BF"/>
    <path d="M5 12A7 7 0 0 1 19 12"
          stroke="white" stroke-width="2.2" fill="none" stroke-linecap="round"/>
    <path d="M19 12 L17.5 10 M19 12 L20.5 10"
          stroke="white" stroke-width="1.8" stroke-linecap="round"/>
    <path d="M19 12A7 7 0 0 1 5 12"
          stroke="white" stroke-width="2.2" fill="none" stroke-linecap="round"/>
    <path d="M5 12 L3.5 14 M5 12 L6.5 14"
          stroke="white" stroke-width="1.8" stroke-linecap="round"/>
  </symbol>

</svg>

<div class="wrap">

  <h1>Калькулятор EUR</h1>
  <p class="subtitle">Три маршрута — одно сравнение</p>

  <!-- Rates -->
  <div class="card">
    <div class="card-title">Курсы</div>

    <!-- BystroBank -->
    <div class="bank-block">
      <div class="bank-hd">
        <!-- logo already contains the bank name -->
        <img class="bank-logo" src="img/bystr.png" alt="Быстробанк">
        <span id="bystr-tag" class="auto-tag" style="margin-left:2px"></span>
        <button class="ref-btn" id="bystr-btn" onclick="fetchBystro()" title="Обновить">↻</button>
        <a class="ext-link" href="https://www.bystrobank.ru/" target="_blank" rel="noopener">↗</a>
      </div>
      <div class="fields-2">
        <div class="field">
          <label>EUR / RUB</label>
          <input type="number" id="bystr-eur" placeholder="89.29" step="0.01" min="0">
        </div>
        <div class="field">
          <label>USD / RUB</label>
          <input type="number" id="bystr-usd" placeholder="73.49" step="0.01" min="0">
        </div>
      </div>
    </div>

    <div class="sep"></div>

    <!-- Korona + Credo -->
    <div class="bank-row">

      <div class="bank-block" style="margin-bottom:0">
        <div class="bank-hd">
          <img class="bank-ico" src="img/korona.png" alt="Корона" style="border-radius:6px">
          <span class="bank-hd-name">Корона</span>
          <span id="korona-tag" class="auto-tag"></span>
          <button class="ref-btn" id="korona-btn" onclick="fetchKorona()" title="Обновить">↻</button>
          <a class="ext-link" href="https://koronapay.com/transfers/europe/?receivingCountryId=ge" target="_blank" rel="noopener">↗</a>
        </div>
        <div class="field">
          <label>USD / RUB</label>
          <input type="number" id="korona-usd" placeholder="75.42" step="0.01" min="0">
        </div>
      </div>

      <div class="bank-block" style="margin-bottom:0">
        <div class="bank-hd">
          <img class="bank-logo" src="img/credo.png" alt="Credo Bank">
          <span id="credo-tag" class="auto-tag" style="margin-left:2px"></span>
          <button class="ref-btn" id="credo-btn" onclick="fetchCredo()" title="Обновить">↻</button>
          <a class="ext-link" href="https://credobank.ge/en/currency" target="_blank" rel="noopener">↗</a>
        </div>
        <div class="field">
          <!-- User enters the rate they SEE on the Credo app: 1 USD = X EUR -->
          <!-- Calculation inverts it internally: 1 EUR = 1/X USD              -->
          <label>1 USD =</label>
          <input type="number" id="credo-rate" placeholder="0.856" step="0.0001" min="0">
          <div id="credo-hint" style="font-size:0.68rem;color:#a0aec0;margin-top:3px"></div>
        </div>
      </div>

    </div>
  </div>

  <!-- Target -->
  <div class="card">
    <div class="target-row">
      <label for="eur-need">Нужно:</label>
      <div class="inp-wrap">
        <input type="number" id="eur-need" value="1000" min="0" step="100">
        <span class="sym">€</span>
      </div>
    </div>
  </div>

  <!-- Results -->
  <div class="results">

    <div class="res-card" id="rc1">
      <div class="res-num">1</div>
      <div class="res-body">
        <div class="res-name">
          <svg class="res-ico"><use href="#ico-bystr"/></svg>
          <span>EUR нал — Быстробанк</span>
        </div>
        <div class="res-rub" id="rub1">—</div>
      </div>
      <div class="res-right">
        <div class="res-rate" id="rate1">—</div>
        <div class="res-rate-label">₽/€</div>
      </div>
    </div>

    <div class="res-card" id="rc2">
      <div class="res-num">2</div>
      <div class="res-body">
        <div class="res-name">
          <svg class="res-ico"><use href="#ico-bystr"/></svg>
          <svg class="res-ico"><use href="#ico-credo"/></svg>
          <span>USD Быстробанк → Кредо</span>
        </div>
        <div class="res-rub" id="rub2">—</div>
      </div>
      <div class="res-right">
        <div class="res-rate" id="rate2">—</div>
        <div class="res-rate-label">₽/€</div>
      </div>
    </div>

    <div class="res-card" id="rc3">
      <div class="res-num">3</div>
      <div class="res-body">
        <div class="res-name">
          <svg class="res-ico"><use href="#ico-korona"/></svg>
          <svg class="res-ico"><use href="#ico-credo"/></svg>
          <span>Корона → Кредо</span>
        </div>
        <div class="res-rub" id="rub3">—</div>
      </div>
      <div class="res-right">
        <div class="res-rate" id="rate3">—</div>
        <div class="res-rate-label">₽/€</div>
      </div>
    </div>

  </div>

  <!-- Verdict -->
  <div class="verdict" id="verdict" style="margin-top:14px">
    Введите курсы выше
  </div>

</div>
<script>
const $ = id => document.getElementById(id);
const n = id => { const v = parseFloat($(id).value); return isFinite(v) && v > 0 ? v : 0; };

const rubFmt  = x => Math.round(x).toLocaleString('ru-RU');
const rateFmt = x => x.toFixed(2);

function calc() {
  const eur       = n('eur-need');
  const bystrEur  = n('bystr-eur');
  const bystrUsd  = n('bystr-usd');
  const koronaUsd = n('korona-usd');

  // credo-rate field holds "1 USD = X EUR" (what user reads on the Credo app/website)
  // We need EUR-per-USD → invert to USD-per-EUR for the calculation
  const credoRaw  = n('credo-rate');             // e.g. 0.856
  const credoRate = credoRaw > 0 ? 1 / credoRaw : 0; // → 1.168 USD per EUR

  const rub1 = (bystrEur > 0 && eur > 0) ? eur * bystrEur : 0;
  const rub2 = (bystrUsd > 0 && credoRate > 0 && eur > 0) ? eur * credoRate * bystrUsd : 0;
  const rub3 = (koronaUsd > 0 && credoRate > 0 && eur > 0) ? eur * credoRate * koronaUsd : 0;

  const effRate1 = rub1 > 0 ? rub1 / eur : 0;
  const effRate2 = rub2 > 0 ? rub2 / eur : 0;
  const effRate3 = rub3 > 0 ? rub3 / eur : 0;

  [['rub1', rub1], ['rub2', rub2], ['rub3', rub3]].forEach(([id, val]) => {
    $(id).textContent = val > 0 ? rubFmt(val) + ' ₽' : '—';
  });
  [['rate1', effRate1], ['rate2', effRate2], ['rate3', effRate3]].forEach(([id, val]) => {
    $(id).textContent = val > 0 ? rateFmt(val) : '—';
  });

  const cards = [
    { id: 'rc1', rub: rub1, label: 'EUR нал Быстробанк' },
    { id: 'rc2', rub: rub2, label: 'USD Быстробанк → Кредо' },
    { id: 'rc3', rub: rub3, label: 'Корона → Кредо' },
  ];

  cards.forEach(c => {
    const el = $(c.id);
    el.classList.remove('winner', 'second', 'loser');
    el.querySelectorAll('.win-badge, .sec-badge').forEach(e => e.remove());
  });

  const valid = cards.filter(c => c.rub > 0);
  if (valid.length < 2) { $('verdict').innerHTML = 'Введите курсы выше'; return; }

  const sorted = [...valid].sort((a, b) => a.rub - b.rub);

  $(sorted[0].id).classList.add('winner');
  $(sorted[0].id).insertAdjacentHTML('beforeend', '<div class="win-badge">ВЫГОДНЕЕ</div>');

  $(sorted[1].id).classList.add('second');
  $(sorted[1].id).insertAdjacentHTML('beforeend', '<div class="sec-badge">2-е место</div>');

  if (sorted[2]) $(sorted[2].id).classList.add('loser');

  const minRub = sorted[0].rub;
  const vsLines = sorted.slice(1).map(c => {
    const d = c.rub - minRub;
    const p = (d / c.rub * 100).toFixed(1);
    return `<div class="vs">vs ${c.label}: −${rubFmt(d)} ₽ (−${p}%)</div>`;
  }).join('');

  const eur2 = n('eur-need');
  $('verdict').innerHTML =
    `<b>${sorted[0].label}</b> — дешевле всего:<br>` +
    `<b>${rubFmt(minRub)} ₽</b> за ${eur2} EUR (курс ${rateFmt(minRub / eur2)} ₽/€)` +
    vsLines;
}

['eur-need','bystr-eur','bystr-usd','korona-usd','credo-rate']
  .forEach(id => $(id).addEventListener('input', calc));

// ── Credo auto-fetch ─────────────────────────────────────────
const CREDO_API_KEY = '1caf66f7cb78b05b448629ba93c0c93eefd0d03b6876cf0f';

async function fetchCredo() {
  const btn = $('credo-btn');
  btn.classList.add('spin');
  btn.disabled = true;

  const date   = new Date().toISOString();
  const target = `https://n1.noxtton.com/v2/credo/current-rates?method=FxRatesCommercial&date=${date}`;

  let data = null;
  for (const url of [
    'https://corsproxy.io/?' + encodeURIComponent(target),
    'https://api.allorigins.win/raw?url=' + encodeURIComponent(target),
    target,
  ]) {
    try {
      const res = await fetch(url, {
        headers: { 'x-api-key': CREDO_API_KEY },
        signal: AbortSignal.timeout(6000),
      });
      if (!res.ok) continue;
      data = await res.json();
      if (data?.rates) break;
    } catch (_) { /* try next */ }
  }

  btn.classList.remove('spin');
  btn.disabled = false;

  const tag  = $('credo-tag');
  const hint = $('credo-hint');

  if (data?.rates) {
    const usd = data.rates.find(r => r.fromCcy === 'USD');
    const eur = data.rates.find(r => r.fromCcy === 'EUR');
    if (usd && eur) {
      // Fill with "1 USD = X EUR" — matches what user sees on credobank.ge
      const rate = usd.buy / eur.sell;
      $('credo-rate').value = rate.toFixed(4);
      const t = new Date().toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
      tag.textContent = `✓ ${t}`;
      tag.className   = 'auto-tag';
      hint.textContent = `→ 1 EUR = ${(1 / rate).toFixed(4)} USD`;
      calc();
      return;
    }
  }

  tag.textContent  = '✗ нет данных';
  tag.className    = 'auto-tag err';
  hint.textContent = 'введите вручную · credobank.ge/en/currency';
}

// ── Bystrobank auto-fetch ─────────────────────────────────────
const BYSTR_URL = 'https://www.bystrobank.ru/sitecurrency/data/CurrentExchangeRates_izhevsk.js';
const PROXY     = 'https://corsproxy.io/?';

async function fetchBystro() {
  const btn = $('bystr-btn');
  btn.classList.add('spin');
  btn.disabled = true;

  let data = null;
  for (const url of [BYSTR_URL, PROXY + encodeURIComponent(BYSTR_URL)]) {
    try {
      const res = await fetch(url, { signal: AbortSignal.timeout(5000) });
      if (!res.ok) continue;
      data = await res.json();
      break;
    } catch (_) { /* try next */ }
  }

  btn.classList.remove('spin');
  btn.disabled = false;

  const tag = $('bystr-tag');

  if (data?.banks?.[0]) {
    const b = data.banks[0];
    $('bystr-eur').value = b.eur.sale;
    $('bystr-usd').value = b.usd.sale;
    const t = new Date().toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
    tag.textContent = `✓ ${t}`;
    tag.className   = 'auto-tag';
    calc();
  } else {
    tag.textContent = '✗ нет данных';
    tag.className   = 'auto-tag err';
  }
}

// ── Korona auto-fetch ─────────────────────────────────────────
const KORONA_URL = 'https://xn-----7kchhgf9amyjqnfnj7l3b2a.xn--p1ai/api/chart-data.php?bank_id=2003&city_id=3762&currency_id=12&currency_code=usd&days=7';
const KORONA_SURCHARGE = 1.06;

async function fetchKorona() {
  const btn = $('korona-btn');
  btn.classList.add('spin');
  btn.disabled = true;

  let data = null;
  for (const url of [
    'https://corsproxy.io/?' + encodeURIComponent(KORONA_URL),
    'https://api.allorigins.win/raw?url=' + encodeURIComponent(KORONA_URL),
    KORONA_URL,
  ]) {
    try {
      const res = await fetch(url, { signal: AbortSignal.timeout(6000) });
      if (!res.ok) continue;
      data = await res.json();
      if (data?.data?.sellRates) break;
    } catch (_) { /* try next */ }
  }

  btn.classList.remove('spin');
  btn.disabled = false;

  const tag = $('korona-tag');

  if (data?.data?.sellRates) {
    const lastRate = [...data.data.sellRates].reverse().find(v => v !== null);
    if (lastRate !== undefined) {
      $('korona-usd').value = (parseFloat(lastRate) + KORONA_SURCHARGE).toFixed(2);
      const t = new Date().toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
      tag.textContent = `✓ ${t}`;
      tag.className   = 'auto-tag';
      calc();
      return;
    }
  }

  tag.textContent = '✗ нет данных';
  tag.className   = 'auto-tag err';
}

fetchBystro();
fetchCredo();
fetchKorona();
calc();
</script>
</body>
</html>
