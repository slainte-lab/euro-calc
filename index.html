<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Калькулятор EUR</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f0f4f8;
      color: #1a202c;
      min-height: 100vh;
      padding: 24px 16px 48px;
    }

    .wrap { max-width: 480px; margin: 0 auto; }

    h1 {
      text-align: center;
      font-size: 1.15rem;
      font-weight: 700;
      color: #2d3748;
      margin-bottom: 4px;
    }
    .subtitle {
      text-align: center;
      font-size: 0.8rem;
      color: #a0aec0;
      margin-bottom: 22px;
    }

    .card {
      background: white;
      border-radius: 14px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.07);
      padding: 18px 20px;
      margin-bottom: 14px;
    }
    .card-title {
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: #a0aec0;
      margin-bottom: 14px;
    }

    .bank-block { margin-bottom: 14px; }
    .bank-block:last-child { margin-bottom: 0; }

    .bank-hd {
      display: flex;
      align-items: center;
      gap: 7px;
      margin-bottom: 9px;
    }
    /* square icon (SVG or small img) */
    .bank-ico {
      width: 22px;
      height: 22px;
      flex-shrink: 0;
    }
    /* full horizontal / brand logo */
    .bank-logo {
      height: 22px;
      width: auto;
      flex-shrink: 0;
    }
    .bank-hd-name {
      font-size: 0.8rem;
      font-weight: 700;
      color: #4a5568;
      flex: 1;
    }

    .bank-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }

    .fields-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 11px;
    }

    .field label {
      display: block;
      font-size: 0.72rem;
      color: #718096;
      margin-bottom: 5px;
    }
    .field input {
      width: 100%;
      border: 1.5px solid #e2e8f0;
      border-radius: 8px;
      padding: 8px 10px;
      font-size: 1.05rem;
      font-weight: 600;
      color: #1a202c;
      outline: none;
      transition: border-color 0.15s;
    }
    .field input:focus { border-color: #4299e1; }
    .field input::placeholder { color: #cbd5e0; font-weight: 400; font-size: 0.95rem; }

    .target-row {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .target-row label {
      font-size: 0.95rem;
      font-weight: 600;
      color: #4a5568;
      white-space: nowrap;
    }
    .target-row .inp-wrap { display: flex; align-items: center; flex: 1; }
    .target-row input {
      flex: 1;
      border: 2px solid #e2e8f0;
      border-radius: 10px;
      padding: 10px 13px;
      font-size: 1.55rem;
      font-weight: 700;
      color: #1a202c;
      outline: none;
      min-width: 0;
      transition: border-color 0.15s;
    }
    .target-row input:focus { border-color: #4299e1; }
    .target-row .sym {
      font-size: 1.4rem;
      font-weight: 700;
      color: #a0aec0;
      margin-left: 9px;
    }

    .results-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; align-items: start; }
    .results-2 > div { min-width: 0; }
    .results-2 .results { gap: 8px; }
    .results-2 .res-card { flex-direction: column; align-items: flex-start; gap: 3px; padding: 10px 11px; }
    .results-2 .res-num { display: none; }
    .results-2 .res-body { width: 100%; }
    .results-2 .res-name { font-size: 0.7rem; align-items: flex-start; }
    .results-2 .res-name span { white-space: normal; overflow: visible; }
    .results-2 .res-ico { width: 13px; height: 13px; margin-top: 1px; }
    .results-2 .res-rub { font-size: 1.25rem; letter-spacing: -0.3px; }
    .results-2 .res-right { text-align: left; display: flex; align-items: baseline; gap: 4px; }
    .results-2 .res-rate { font-size: 0.85rem; }
    .results-2 .res-rate-label { margin-top: 0; }
    .results-2 .verdict { padding: 10px 11px; font-size: 0.74rem; }
    .results-2 .verdict b { font-size: 0.8rem; }
    .results-2 .win-badge, .results-2 .sec-badge { right: 8px; font-size: 0.55rem; padding: 1px 6px; }
    .col-title { font-size: 0.72rem; font-weight: 800; letter-spacing: 1px; color: #a0aec0; text-transform: uppercase; margin: 0 0 8px 4px; }
    .results { display: flex; flex-direction: column; gap: 10px; }

    .res-card {
      background: white;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.07);
      padding: 14px 18px;
      display: flex;
      align-items: center;
      gap: 14px;
      border: 3px solid transparent;
      transition: border-color 0.25s, opacity 0.25s;
      position: relative;
    }
    .res-card.winner { border-color: #68d391; }
    .res-card.second { border-color: #f6e05e; }
    .res-card.loser  { opacity: 0.42; }

    .res-num {
      font-size: 0.65rem;
      font-weight: 800;
      color: #cbd5e0;
      width: 18px;
      flex-shrink: 0;
      text-align: center;
    }
    .res-card.winner .res-num { color: #68d391; }
    .res-card.second .res-num { color: #d69e2e; }

    .res-body { flex: 1; min-width: 0; }
    .res-name {
      font-size: 0.82rem;
      color: #718096;
      margin-bottom: 3px;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .res-name span {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      min-width: 0;
    }
    .res-ico { width: 15px; height: 15px; flex-shrink: 0; }

    .res-rub {
      font-size: 1.65rem;
      font-weight: 700;
      color: #1a202c;
      letter-spacing: -0.5px;
      line-height: 1;
    }
    .res-card.winner .res-rub { color: #276749; }
    .res-card.second .res-rub { color: #744210; }

    .res-right { text-align: right; flex-shrink: 0; }
    .res-rate { font-size: 1.05rem; font-weight: 700; color: #2d3748; }
    .res-rate-label { font-size: 0.7rem; color: #a0aec0; margin-top: 2px; }

    .win-badge, .sec-badge {
      position: absolute;
      top: -1px; right: 14px;
      font-size: 0.62rem;
      font-weight: 800;
      padding: 2px 8px;
      border-radius: 0 0 8px 8px;
      letter-spacing: 0.5px;
    }
    .win-badge { background: #68d391; color: #22543d; }
    .sec-badge { background: #f6e05e; color: #744210; }

    .verdict {
      background: white;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.07);
      padding: 14px 18px;
      text-align: center;
      font-size: 0.9rem;
      color: #718096;
    }
    .verdict b { color: #2d3748; font-size: 1rem; }
    .verdict .vs { font-size: 0.78rem; color: #a0aec0; margin-top: 4px; }

    .auto-tag { font-size: 0.65rem; font-weight: 600; color: #68d391; }
    .auto-tag.err { color: #fc8181; }

    .ref-btn {
      background: none;
      border: 1px solid #e2e8f0;
      border-radius: 5px;
      color: #718096;
      font-size: 0.8rem;
      padding: 1px 5px;
      cursor: pointer;
      line-height: 1.4;
      transition: background 0.15s;
    }
    .ref-btn:hover { background: #edf2f7; }
    .ref-btn.spin { animation: spin 0.7s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .ext-link { color: #4299e1; text-decoration: none; font-size: 0.72rem; }
    .ext-link:hover { color: #2b6cb0; }
    .sep { height: 1px; background: #f0f4f8; margin: 14px 0; }
  </style>
</head>
<body>

<!-- ── Inline SVG logos (no external requests) ─────────────────── -->
<svg style="display:none" aria-hidden="true">

  <!-- BystroBank: orange background, white right arrow -->
  <symbol id="ico-bystr" viewBox="0 0 24 24">
    <rect width="24" height="24" rx="5" fill="#F5891A"/>
    <path d="M5 12h14M13 7l6 5-6 5"
          stroke="white" stroke-width="2.5"
          stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </symbol>

  <!-- T-Bank: yellow background, dark "T" -->
  <symbol id="ico-tbank" viewBox="0 0 24 24">
    <rect width="24" height="24" rx="5" fill="#FFDD2D"/>
    <path d="M6 7h12M12 7v11" stroke="#333" stroke-width="3" stroke-linecap="round" fill="none"/>
  </symbol>

  <!-- Credo: blue background, white circular sync arrows -->
  <symbol id="ico-credo" viewBox="0 0 24 24">
    <rect width="24" height="24" rx="5" fill="#0070BF"/>
    <path d="M5 12A7 7 0 0 1 19 12"
          stroke="white" stroke-width="2.2" fill="none" stroke-linecap="round"/>
    <path d="M19 12 L17.5 10 M19 12 L20.5 10"
          stroke="white" stroke-width="1.8" stroke-linecap="round"/>
    <path d="M19 12A7 7 0 0 1 5 12"
          stroke="white" stroke-width="2.2" fill="none" stroke-linecap="round"/>
    <path d="M5 12 L3.5 14 M5 12 L6.5 14"
          stroke="white" stroke-width="1.8" stroke-linecap="round"/>
  </symbol>

</svg>

<div class="wrap">

  <h1>Калькулятор EUR</h1>
  <p class="subtitle">Маршруты для евро и долларов — раздельно</p>

  <!-- Rates -->
  <div class="card">
    <div class="card-title">Курсы</div>

    <!-- BystroBank -->
    <div class="bank-block">
      <div class="bank-hd">
        <!-- logo already contains the bank name -->
        <img class="bank-logo" src="img/bystr.png" alt="Быстробанк">
        <span id="bystr-tag" class="auto-tag" style="margin-left:2px"></span>
        <button class="ref-btn" id="bystr-btn" onclick="fetchBystro()" title="Обновить">↻</button>
        <a class="ext-link" href="https://www.bystrobank.ru/" target="_blank" rel="noopener">↗</a>
      </div>
      <div class="fields-2">
        <div class="field">
          <label>EUR / RUB</label>
          <input type="number" id="bystr-eur" placeholder="89.29" step="0.01" min="0">
        </div>
        <div class="field">
          <label>USD / RUB</label>
          <input type="number" id="bystr-usd" placeholder="73.49" step="0.01" min="0">
        </div>
      </div>
    </div>

    <div class="sep"></div>

    <!-- T-Bank + Credo -->
    <div class="bank-row">

      <div class="bank-block" style="margin-bottom:0">
        <div class="bank-hd">
          <svg class="bank-ico" style="border-radius:6px"><use href="#ico-tbank"/></svg>
          <span class="bank-hd-name">Т-Банк</span>
          <span id="tb-tag" class="auto-tag"></span>
          <button class="ref-btn" id="tb-btn" onclick="fetchTbank()" title="Обновить">↻</button>
          <a class="ext-link" href="https://www.tbank.ru/about/exchange/" target="_blank" rel="noopener">↗</a>
        </div>
        <div class="field">
          <!-- Rate from tbank.ru/about/exchange (same backend as the page table) -->
          <label>GEL / RUB (сайт Т-Банка)</label>
          <input type="number" id="tb-gel" placeholder="32.58" step="0.001" min="0">
        </div>
        <div class="field" style="margin-top:6px">
          <!-- App IBAN rate vs site rate: 33.47 / 32.583 ≈ +2.7 % (measured 29.10.2026) -->
          <label>Накидка к сайту (как в приложении), %</label>
          <input type="number" id="tb-adj" value="2.7" step="0.1" min="0">
          <div id="tb-hint" style="font-size:0.68rem;color:#a0aec0;margin-top:3px"></div>
        </div>
      </div>

      <div class="bank-block" style="margin-bottom:0">
        <div class="bank-hd">
          <img class="bank-logo" src="img/credo.png" alt="Credo Bank">
          <span id="credo-tag" class="auto-tag" style="margin-left:2px"></span>
          <button class="ref-btn" id="credo-btn" onclick="fetchCredo()" title="Обновить">↻</button>
          <a class="ext-link" href="https://credobank.ge/en/currency" target="_blank" rel="noopener">↗</a>
        </div>
        <div class="field">
          <!-- User enters the rate they SEE on the Credo app: 1 USD = X EUR -->
          <!-- Calculation inverts it internally: 1 EUR = 1/X USD              -->
          <label>1 USD =</label>
          <input type="number" id="credo-rate" placeholder="0.856" step="0.0001" min="0">
          <div id="credo-hint" style="font-size:0.68rem;color:#a0aec0;margin-top:3px"></div>
        </div>
        <div class="field" style="margin-top:6px">
          <label>EUR / GEL (покупка в Кредо)</label>
          <input type="number" id="credo-eurgel" placeholder="3.15" step="0.0001" min="0">
        </div>
        <div class="field" style="margin-top:6px">
          <label>USD / GEL (продажа в Кредо)</label>
          <input type="number" id="credo-usdgel" placeholder="2.70" step="0.0001" min="0">
        </div>
      </div>

    </div>
  </div>

  <!-- Target -->
  <div class="card">
    <div class="target-row" style="margin-bottom:10px">
      <label for="eur-need">Нужно:</label>
      <div class="inp-wrap">
        <input type="number" id="eur-need" value="1000" min="0" step="100">
        <span class="sym">€</span>
      </div>
    </div>
    <div class="target-row">
      <label for="usd-need" style="visibility:hidden">Нужно:</label>
      <div class="inp-wrap">
        <input type="number" id="usd-need" value="1000" min="0" step="100">
        <span class="sym">$</span>
      </div>
    </div>
  </div>

  <!-- Results: two independent columns -->
  <div class="results-2">
    <div>
      <div class="col-title">Евро €</div>
      <div class="results" id="res-eur"></div>
      <div class="verdict" id="verdict-eur" style="margin-top:14px">Введите курсы выше</div>
    </div>
    <div>
      <div class="col-title">Доллары $</div>
      <div class="results" id="res-usd"></div>
      <div class="verdict" id="verdict-usd" style="margin-top:14px">Введите курсы выше</div>
    </div>
  </div>

</div>
<script>
const $ = id => document.getElementById(id);
const n = id => { const v = parseFloat($(id).value); return isFinite(v) && v > 0 ? v : 0; };

const rubFmt  = x => Math.round(x).toLocaleString('ru-RU');
const rateFmt = x => x.toFixed(2);

const ICO = { bystr: '#ico-bystr', credo: '#ico-credo', tbank: '#ico-tbank' };

// items: [{ label, icons, rub }]; cur: '€' | '$'; amount: how much of cur is needed
function render(resId, verdictId, items, cur, amount) {
  const host = $(resId);
  const sorted = items.filter(i => i.rub > 0).sort((a, b) => a.rub - b.rub);
  const rank = new Map(sorted.map((it, k) => [it, k]));

  host.innerHTML = items.map((it, idx) => {
    const k = rank.get(it);
    const cls = k === 0 ? 'winner' : k === 1 ? 'second' : (k !== undefined && sorted.length > 2 ? 'loser' : '');
    const badge = k === 0 ? '<div class="win-badge">ВЫГОДНЕЕ</div>' : k === 1 ? '<div class="sec-badge">2-е место</div>' : '';
    const icons = it.icons.map(i => `<svg class="res-ico"><use href="${ICO[i]}"/></svg>`).join('');
    return `<div class="res-card ${cls}">
      <div class="res-num">${idx + 1}</div>
      <div class="res-body">
        <div class="res-name">${icons}<span>${it.label}</span></div>
        <div class="res-rub">${it.rub > 0 ? rubFmt(it.rub) + ' ₽' : '—'}</div>
      </div>
      <div class="res-right">
        <div class="res-rate">${it.rub > 0 && amount > 0 ? rateFmt(it.rub / amount) : '—'}</div>
        <div class="res-rate-label">₽/${cur}</div>
      </div>${badge}
    </div>`;
  }).join('');

  const v = $(verdictId);
  if (sorted.length < 2) { v.innerHTML = 'Введите курсы выше'; return; }
  const min = sorted[0].rub;
  const vs = sorted.slice(1).map(c =>
    `<div class="vs">vs ${c.label}: −${rubFmt(c.rub - min)} ₽ (−${((c.rub - min) / c.rub * 100).toFixed(1)}%)</div>`).join('');
  v.innerHTML = `<b>${sorted[0].label}</b> — дешевле всего:<br>` +
    `<b>${rubFmt(min)} ₽</b> за ${amount} ${cur} (курс ${rateFmt(min / amount)} ₽/${cur})` + vs;
}

function calc() {
  const eur       = n('eur-need');
  const usd       = n('usd-need');
  const bystrEur  = n('bystr-eur');
  const bystrUsd  = n('bystr-usd');
  const tbGel     = n('tb-gel');
  const tbAdj     = 1 + (parseFloat($('tb-adj').value) || 0) / 100;
  const eurGel    = n('credo-eurgel');
  const usdGel    = n('credo-usdgel');
  $('tb-hint').textContent = tbGel > 0 ? `→ 1 GEL = ${(tbGel * tbAdj).toFixed(2)} ₽` : '';

  // credo-rate field holds "1 USD = X EUR" (what user reads on the Credo app/website)
  // We need USD-per-EUR for buying EUR with USD → invert
  const credoRaw  = n('credo-rate');
  const credoRate = credoRaw > 0 ? 1 / credoRaw : 0;

  const tbRub = tbGel * tbAdj; // ₽ per 1 GEL via T-Bank IBAN

  // EUR needed
  render('res-eur', 'verdict-eur', [
    { label: 'EUR нал — Быстробанк',   icons: ['bystr'],          rub: bystrEur > 0 ? eur * bystrEur : 0 },
    { label: 'USD Быстробанк → Кредо', icons: ['bystr', 'credo'], rub: bystrUsd > 0 && credoRate > 0 ? eur * credoRate * bystrUsd : 0 },
    { label: 'Т-Банк GEL → Кредо',     icons: ['tbank', 'credo'], rub: tbRub > 0 && eurGel > 0 ? eur * eurGel * tbRub : 0 },
  ].map(i => eur > 0 ? i : { ...i, rub: 0 }), '€', eur);

  // USD needed
  render('res-usd', 'verdict-usd', [
    { label: 'USD нал — Быстробанк',   icons: ['bystr'],          rub: bystrUsd > 0 ? usd * bystrUsd : 0 },
    { label: 'Т-Банк GEL → Кредо',     icons: ['tbank', 'credo'], rub: tbRub > 0 && usdGel > 0 ? usd * usdGel * tbRub : 0 },
  ].map(i => usd > 0 ? i : { ...i, rub: 0 }), '$', usd);
}

['eur-need','usd-need','bystr-eur','bystr-usd','tb-gel','tb-adj','credo-rate','credo-eurgel','credo-usdgel']
  .forEach(id => $(id).addEventListener('input', calc));

// ── Credo auto-fetch ─────────────────────────────────────────
const CREDO_API_KEY = '1caf66f7cb78b05b448629ba93c0c93eefd0d03b6876cf0f';

async function fetchCredo() {
  const btn = $('credo-btn');
  btn.classList.add('spin');
  btn.disabled = true;

  const date   = new Date().toISOString();
  const target = `https://n1.noxtton.com/v2/credo/current-rates?method=FxRatesCommercial&date=${date}`;

  let data = null;
  for (const url of [
    'https://corsproxy.io/?' + encodeURIComponent(target),
    'https://api.allorigins.win/raw?url=' + encodeURIComponent(target),
    target,
  ]) {
    try {
      const res = await fetch(url, {
        headers: { 'x-api-key': CREDO_API_KEY },
        signal: AbortSignal.timeout(6000),
      });
      if (!res.ok) continue;
      data = await res.json();
      if (data?.rates) break;
    } catch (_) { /* try next */ }
  }

  btn.classList.remove('spin');
  btn.disabled = false;

  const tag  = $('credo-tag');
  const hint = $('credo-hint');

  if (data?.rates) {
    const usd = data.rates.find(r => r.fromCcy === 'USD');
    const eur = data.rates.find(r => r.fromCcy === 'EUR');
    if (usd && eur) {
      // Fill with "1 USD = X EUR" — matches what user sees on credobank.ge
      const rate = usd.buy / eur.sell;
      $('credo-rate').value = rate.toFixed(4);
      $('credo-eurgel').value = eur.sell;
      $('credo-usdgel').value = usd.sell;
      const t = new Date().toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
      tag.textContent = `✓ ${t}`;
      tag.className   = 'auto-tag';
      hint.textContent = `→ 1 EUR = ${(1 / rate).toFixed(4)} USD`;
      calc();
      return;
    }
  }

  tag.textContent  = '✗ нет данных';
  tag.className    = 'auto-tag err';
  hint.textContent = 'введите вручную · credobank.ge/en/currency';
}

// ── Bystrobank auto-fetch ─────────────────────────────────────
const BYSTR_URL = 'https://www.bystrobank.ru/sitecurrency/data/CurrentExchangeRates_izhevsk.js';
const PROXY     = 'https://corsproxy.io/?';
// URL своего прокси (см. yandex-function/index.js), напр. 'https://functions.yandexcloud.net/<id>'
const BYSTR_WORKER = 'https://functions.yandexcloud.net/d4eag5940do248gf43ad';

async function fetchBystro() {
  const btn = $('bystr-btn');
  btn.classList.add('spin');
  btn.disabled = true;

  const enc = encodeURIComponent(BYSTR_URL);
  let data = null;
  for (const url of [
    ...(BYSTR_WORKER ? [BYSTR_WORKER] : []),
    'https://api.codetabs.com/v1/proxy/?quest=' + BYSTR_URL,
    'https://api.cors.lol/?url=' + enc,
    'https://thingproxy.freeboard.io/fetch/' + BYSTR_URL,
    'https://api.allorigins.win/get?url=' + enc,
    PROXY + enc,
    BYSTR_URL,
  ]) {
    try {
      const res = await fetch(url, { signal: AbortSignal.timeout(6000) });
      if (!res.ok) continue;
      let parsed = JSON.parse(await res.text());
      if (typeof parsed?.contents === 'string') parsed = JSON.parse(parsed.contents); // allorigins /get
      if (parsed?.banks?.[0]) { data = parsed; break; }
    } catch (_) { /* try next */ }
  }

  btn.classList.remove('spin');
  btn.disabled = false;

  const tag = $('bystr-tag');

  if (data?.banks?.[0]) {
    const b = data.banks[0];
    $('bystr-eur').value = b.eur.sale;
    $('bystr-usd').value = b.usd.sale;
    const t = new Date().toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
    tag.textContent = `✓ ${t}`;
    tag.className   = 'auto-tag';
    calc();
  } else {
    tag.textContent = '✗ нет данных';
    tag.className   = 'auto-tag err';
  }
}

// ── T-Bank auto-fetch ─────────────────────────────────────────
// Same backend the tbank.ru/about/exchange table uses; CORS is open.
// DebitCardsOperations = "между своими счетами и оплата услуг" rate.
const TBANK_URL = 'https://www.tbank.ru/api/common/v1/currency_rates?from=GEL&to=RUB';

async function fetchTbank() {
  const btn = $('tb-btn');
  btn.classList.add('spin');
  btn.disabled = true;

  let sell = 0;
  try {
    const res = await fetch(TBANK_URL, { signal: AbortSignal.timeout(6000) });
    const j = await res.json();
    sell = j?.payload?.rates?.find(r => r.category === 'DebitCardsOperations')?.sell || 0;
  } catch (_) { /* leave empty */ }

  btn.classList.remove('spin');
  btn.disabled = false;

  const tag = $('tb-tag');
  if (sell > 0) {
    $('tb-gel').value = sell;
    const t = new Date().toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
    tag.textContent = `✓ ${t}`;
    tag.className   = 'auto-tag';
    calc();
  } else {
    tag.textContent = '✗ нет данных';
    tag.className   = 'auto-tag err';
  }
}

fetchBystro();
fetchCredo();
fetchTbank();
calc();
</script>
